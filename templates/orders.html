{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Manual Order Placement</h2>

{% if message %}
<div class="alert alert-info">
    {{ message }}
</div>
{% endif %}

<div class="card shadow-sm p-4">

    <form method="POST">

        <label class="form-label">Stock Symbol</label>
        <input class="form-control mb-3" type="text" name="symbol" placeholder="INFY" required>

        <label class="form-label">Transaction Type</label>
        <select class="form-select mb-3" name="transaction_type" required>
            <option value="BUY">BUY</option>
            <option value="SELL">SELL</option>
        </select>

        <label class="form-label">Quantity</label>
        <input class="form-control mb-3" type="number" name="quantity" min="1" required>

        <button class="btn btn-danger" type="submit">Place Real Market Order</button>

    </form>

</div>

<p class="mt-3 text-danger">
    Warning: This places a real Zerodha order.
</p>

{% endblock %}
