{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">AI Multi-Timeframe Confirmation</h2>

<div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white">
        Select Stock
    </div>

    <div class="card-body">
        <form method="GET" action="/ai-confirmation">
            <select name="symbol" class="form-select mb-3">
                {% for symbol in watchlist_symbols %}
                    <option value="{{ symbol }}" {% if symbol == selected_symbol %}selected{% endif %}>
                        {{ symbol }}
                    </option>
                {% endfor %}
            </select>

            <button class="btn btn-primary" type="submit">
                Analyze
            </button>
        </form>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
        AI Confirmation Result
    </div>

    <div class="card-body" id="result">
        Loading...
    </div>
</div>

<script>
async function loadConfirmation() {
    const response = await fetch("/api/ai-confirmation/{{ selected_symbol }}");
    const data = await response.json();

    if (data.error) {
        document.getElementById("result").innerHTML = data.error;
        return;
    }

    document.getElementById("result").innerHTML = `
        <h4>${data.symbol}</h4>
        <p><b>Signal:</b> ${data.signal}</p>
        <p><b>Confidence:</b> ${data.confidence}%</p>
        <p><b>Score:</b> ${data.score}</p>
        <p><b>RSI:</b> ${data.rsi}</p>
        <p><b>EMA20:</b> ${data.ema20}</p>
        <p><b>EMA50:</b> ${data.ema50}</p>
        <p><b>MACD:</b> ${data.macd}</p>
        <p><b>MACD Signal:</b> ${data.macd_signal}</p>
        <hr>
        <b>Reasons:</b>
        <ul>
            ${data.reasons.map(reason => `<li>${reason}</li>`).join("")}
        </ul>
    `;
}

loadConfirmation();
</script>

{% endblock %}
