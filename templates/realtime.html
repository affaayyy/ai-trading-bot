{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Real-Time Live Market Dashboard</h2>

<div class="alert alert-success">
    Live prices auto-refresh every 5 seconds.
</div>

<div class="card shadow-sm">
    <div class="card-header bg-dark text-white">
        Live Prices
    </div>

    <div class="card-body">
        <table class="table table-striped">
            <tr>
                <th>Stock</th>
                <th>Live Price</th>
            </tr>

            <tr><td>INFY</td><td id="INFY">Loading...</td></tr>
            <tr><td>RELIANCE</td><td id="RELIANCE">Loading...</td></tr>
            <tr><td>TCS</td><td id="TCS">Loading...</td></tr>
            <tr><td>HDFCBANK</td><td id="HDFCBANK">Loading...</td></tr>
        </table>
    </div>
</div>

<script>
async function loadLivePrices() {
    const response = await fetch("/api/live-prices");
    const data = await response.json();

    if (data.error) {
        console.log(data.error);
        return;
    }

    document.getElementById("INFY").innerHTML = "₹" + data.INFY;
    document.getElementById("RELIANCE").innerHTML = "₹" + data.RELIANCE;
    document.getElementById("TCS").innerHTML = "₹" + data.TCS;
    document.getElementById("HDFCBANK").innerHTML = "₹" + data.HDFCBANK;
}

loadLivePrices();
setInterval(loadLivePrices, 5000);
</script>

{% endblock %}
